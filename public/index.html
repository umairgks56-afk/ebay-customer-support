<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eBay Customer Support AI</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="app"><header><div><div class="eyebrow">NTEK • eBay Support</div><h1>Customer Support AI</h1><p>Paste a buyer message and generate a ready-to-send UK-English reply.</p></div><span id="status">Ready</span></header>
<section class="grid"><div class="card"><label>Buyer message <b>*</b></label><textarea id="customerMessage" placeholder="Hi, when will my order arrive?"></textarea><div class="row"><div><label>Category</label><select id="category"><option>General</option><option>Delivery / Tracking</option><option>Product Question</option><option>Return</option><option>Refund</option><option>Cancellation</option><option>Complaint</option><option>Offer / Price</option><option>Feedback</option><option>Damaged / Faulty Item</option></select></div><div><label>Tone</label><select id="tone"><option>Polite & professional</option><option>Friendly & natural</option><option>Short & direct</option><option>Apologetic & reassuring</option><option>Firm but polite</option></select></div></div><label>Order / product context <small>(optional)</small></label><textarea id="orderContext" class="small" placeholder="Tracking info, product details, approved refund, etc."></textarea><label>Your instructions <small>(optional)</small></label><textarea id="sellerInstructions" class="small" placeholder="e.g. Do not offer a refund."></textarea><button id="generate">Generate Reply</button><div class="hint">Your API key stays on the server.</div></div>
<div class="card output"><div class="outhead"><label>Ready-to-send reply</label><button id="copy" disabled>Copy</button></div><textarea id="reply" readonly placeholder="Generated reply will appear here..."></textarea><div class="actions"><button id="regenerate" disabled>Regenerate</button><button id="clear">Clear</button></div></div></section></main><script src="/app.js"></script></body></html>
